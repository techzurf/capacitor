
workflows:
  android-capacitor:
    name: Sirajan Muneera Android Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 20
      java: 17

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install Android platform support
        script: npm install @capacitor/android

      - name: Build web application
        script: npm run build

      - name: Generate Android project if needed
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
